# The store is one static page (site/index.html) plus a few Netlify Functions
# (netlify/functions/) that save orders, stock, site edits and photos in Netlify Blobs.
# The admin logs in with Netlify Identity (invite only), like the lab website.
[build]
  publish = "site"
  functions = "netlify/functions"
  command = "echo 'No build step: site/ is published as is'"

[build.environment]
  NODE_VERSION = "22"

# /admin opens the same page on its admin screen.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
